[project]
name = "pokinder-backend"
version = "0.27.2"
description = "The backend system of Pokinder."
authors = [{ name = "dylandoamaral", email = "do.amaral.dylan@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.3.0,<3",
    "alembic>=1.12.0,<2",
    "sqlalchemy>=2.0.43,<3",
    "litestar[prometheus,sqlalchemy,standard]>=2.19.0,<3",
    "asyncpg>=0.28.0,<0.29",
    "greenlet>=3.0.3,<4",
    "requests>=2.31.0,<3",
    "beautifulsoup4>=4.12.2,<5",
    "bcrypt>=4.1.1,<5",
    "joserfc>=0.9.0,<0.10",
    "minio>=7.2.0,<8",
    "pillow>=10.1.0,<11",
    "redis>=5.1.1,<6",
]

[dependency-groups]
dev = [
    "isort>=5.12.0,<6",
    "black>=23.7.0,<24",
    "pytest>=7.4.2,<8",
    "ruff==0.0.290",
    "scikit-image>=0.25.2,<0.26",
    "numpy>=2.3.3,<3",
    "playwright>=1.61.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 120
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.ruff]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "C90", # mccabe
    "D", # pydocstyle
    "DJ", # flake8-django
    "DTZ", # flake8-datetimez
    "E", # pycodestyle errors
    "ERA", # eradicate
    "EXE", # flake8-executable
    "F", # pyflakes
    "G", # flake8-logging-format
    "I", # isort
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "N", # pep8-naming
    "PIE", # flake8-pie
    "PLC", # pylint - convention
    "PLE", # pylint - error
    "PLW", # pylint - warning
    "PTH", # flake8-use-pathlib
    "Q", # flake8-quotes
    "RET", # flake8-return
    "RUF", # Ruff-specific rules
    "S", # flake8-bandit
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP", # pyupgrade
    "W", # pycodestyle - warning
    "YTT", # flake8-2020
]
ignore = [
    "E501", # pycodestyle line too long, handled by black
    "D100", # pydocstyle - missing docstring in public module
    "D101", # pydocstyle - missing docstring in public class
    "D102", # pydocstyle - missing docstring in public method
    "D103", # pydocstyle - missing docstring in public function
    "D104", # pydocstyle - missing docstring in public package
    "D105", # pydocstyle - missing docstring in magic method
    "D106", # pydocstyle - missing docstring in public nested class
    "D107", # pydocstyle - missing docstring in __init__
    "D202", # pydocstyle - no blank lines allowed after function docstring
    "D205", # pydocstyle - 1 blank line required between summary line and description
    "D415", # pydocstyle - first line should end with a period, question mark, or exclamation point
    "A003", # flake8-builtins - class attribute {name} is shadowing a python builtin
    "B010", # flake8-bugbear - do not call setattr with a constant attribute value
    "RUF012", # Ruff-specific rule
]
line-length = 120
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.isort]
known-first-party = ["src", "tests"]

[tool.ruff.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "sqlalchemy.orm.declared_attr.directive",
]
